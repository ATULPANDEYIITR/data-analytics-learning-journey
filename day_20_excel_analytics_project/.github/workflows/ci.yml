name: Sales Analytics CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lint checks
        run: ruff check src tests

      - name: Run tests
        run: pytest

      - name: Build Excel workbook
        run: python src/create_workbook.py

      - name: Verify workbook exists
        run: test -f output/sales_analytics_dashboard.xlsx
